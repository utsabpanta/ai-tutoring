# Socratic Tutor — fully local stack.
#
# `docker compose up` boots ollama, the API, and the web UI. The first boot
# pulls the configured models (~5GB total) and is the only slow part — every
# subsequent boot is fast.
#
# NOTE for macOS users: ollama inside Docker runs on CPU only (no Metal
# acceleration). For active development on a Mac, run ollama natively
# (`brew install ollama`) and the API/web via `pnpm dev`. Use docker compose
# for clean-environment demos and Linux deployments where GPU passthrough
# works.

name: socratic-tutor

services:
  ollama:
    image: ollama/ollama:latest
    container_name: socratic-ollama
    entrypoint: ["/bin/sh", "/entry.sh"]
    environment:
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct-q4_K_M}
      MODERATION_MODEL: ${MODERATION_MODEL:-llama-guard3:1b}
    volumes:
      - ./docker/ollama-entry.sh:/entry.sh:ro
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: socratic-api
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct-q4_K_M}
      MODERATION_MODEL: ${MODERATION_MODEL:-llama-guard3:1b}
      DB_PATH: /data/tutor.db
      WEB_ORIGIN: http://localhost:3000
      API_PORT: "8787"
    volumes:
      - ./server/src:/app/server/src:ro
      - ./prompts:/app/prompts:ro
      - api-data:/data
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: socratic-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_URL: http://api:8787
    volumes:
      - ./web/src:/app/web/src:ro
      - ./web/index.html:/app/web/index.html:ro
    ports:
      - "3000:3000"

volumes:
  ollama-models:
  api-data:
